<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Russo;src:url(fonts/RussoOne-Regular.ttf)}
@font-face{font-family:Wet;src:url(fonts/RubikWetPaint-Regular.ttf)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
const W = 1080, H = 1920, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let TL = null;              // timeline, injected
let GROUPS = [];            // resolved shot groups

// ---------------- utils ----------------
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-clamp(t),3);
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
function hash(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1}
function rgba(r,g,b,a){return `rgba(${r|0},${g|0},${b|0},${a})`}

function vgrad(y0,y1,stops){const g=ctx.createLinearGradient(0,y0,0,y1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}
function rgrad(x,y,r0,r1,stops){const g=ctx.createRadialGradient(x,y,r0,x,y,r1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}
function fillAll(style){ctx.fillStyle=style;ctx.fillRect(-200,-200,W+400,H+400)}
function glow(x,y,r,col,a=1){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=rgrad(x,y,0,r,[[0,col],[1,'rgba(0,0,0,0)']]);ctx.fillRect(x-r,y-r,2*r,2*r);ctx.restore()}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

function moon(x,y,r,col,glowCol){glow(x,y,r*4,glowCol,.55);ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.12)';[[.3,-.2,.22],[-.35,.25,.15],[.1,.4,.12]].forEach(([a,b,c])=>{ctx.beginPath();ctx.arc(x+a*r,y+b*r,c*r,0,TAU);ctx.fill()})}

function clouds(seed,t,y0,y1,col,n=7,speed=8){const R=mulberry(seed);ctx.fillStyle=col;
  for(let i=0;i<n;i++){const y=lerp(y0,y1,R()),w=200+R()*380,x=((R()*(W+800)+t*speed*(.5+R()))%(W+800))-400;
    ctx.beginPath();for(let k=0;k<5;k++){ctx.ellipse(x+k*w/5,y+Math.sin(k*1.7)*14,w/4,30+R()*25,0,0,TAU)}ctx.fill()}}

// building skyline; lit(i,j,bx) returns window alpha 0..1
function skyline(seed,baseY,minH,maxH,col,winCol,lit,opts={}){
  const R=mulberry(seed);let x=-60;const res=[];
  while(x<W+60){const w=90+R()*150,h=minH+R()*(maxH-minH);res.push([x,w,h,R()]);x+=w+(opts.gap||0)+R()*8}
  res.forEach(([bx,bw,bh,r],i)=>{
    ctx.fillStyle=col;ctx.beginPath();
    if(opts.broken&&r>.4){ctx.moveTo(bx,baseY);ctx.lineTo(bx,baseY-bh);ctx.lineTo(bx+bw*.3,baseY-bh+30*r);ctx.lineTo(bx+bw*.5,baseY-bh-20);ctx.lineTo(bx+bw*.7,baseY-bh+50);ctx.lineTo(bx+bw,baseY-bh+15);ctx.lineTo(bx+bw,baseY)}
    else{ctx.rect(bx,baseY-bh,bw,bh);if(r>.75){ctx.rect(bx+bw*.45,baseY-bh-60,6,60)}}
    ctx.fill();
    if(winCol){const cols=Math.floor((bw-20)/26),rows=Math.floor((bh-30)/38);
      for(let c=0;c<cols;c++)for(let rI=0;rI<rows;rI++){const a=lit(i,c,rI,bx);if(a<=0.02)continue;
        ctx.fillStyle=winCol;ctx.globalAlpha=a;ctx.fillRect(bx+14+c*26,baseY-bh+22+rI*38,14,20)}ctx.globalAlpha=1}
    if(opts.vines){ctx.fillStyle=opts.vines;const RR=mulberry(i*91+7);for(let k=0;k<18;k++){const vx=bx+RR()*bw,vy=baseY-RR()*bh*.9;ctx.beginPath();ctx.ellipse(vx,vy,18+RR()*30,24+RR()*40,0,0,TAU);ctx.fill()}
      ctx.fillRect(bx,baseY-bh*RR()*.5,bw*.25,bh)}
  });
  return res;
}

// ---------------- characters ----------------
function limb(pts,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke()}
// zombie silhouette, feet at (x,y), height ~ 200*s
function zombie(x,y,s,t,o={}){
  const f=o.facing||1,col=o.col||'#0b0b0b',sp=o.speed??1,ph=(o.phase||0)+t*sp*3.2;
  const jerk=o.jerky?Math.round(Math.sin(ph*.5)*2)/2:0;
  ctx.save();ctx.translate(x,y);ctx.scale(s*f,s);
  const lg=Math.sin(ph)*.45,bob=Math.abs(Math.sin(ph))*6;
  const hip=[0,-92+bob*.5];
  // legs (one drags)
  limb([hip,[Math.sin(lg)*40+6,-48],[Math.sin(lg)*62+4,0]],17,col);
  limb([hip,[-Math.sin(lg)*30-4,-46],[-Math.sin(lg)*50-12,0]],17,col);
  const sh=[22+jerk*6,-160+bob];
  limb([hip,[10,-128+bob],sh],32,col);           // hunched torso
  const sway=Math.sin(ph*.5+1)*8;
  const armUp=o.armsUp??1;
  limb([sh,[52,-150+bob+sway*.4-armUp*6],[88,-146+sway-armUp*16]],13,col);
  limb([[sh[0]-8,sh[1]+4],[40,-138+bob-sway*.4],[76,-130-sway-armUp*10]],13,col);
  // head, tilted
  ctx.save();ctx.translate(sh[0]+16,sh[1]-24);ctx.rotate((o.tilt??.35)+Math.sin(ph*.7)*.08+jerk*.3);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,0,18,21,0,0,TAU);ctx.fill();
  if(o.eye){ctx.fillStyle=o.eye;ctx.shadowColor=o.eye;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(9,-3,3.6,0,TAU);ctx.arc(-1,-4,3.2,0,TAU);ctx.fill();ctx.shadowBlur=0}
  ctx.restore();
  ctx.restore();
}
function human(x,y,s,t,o={}){
  const f=o.facing||1,col=o.col||'#0b0b0b',ph=(o.phase||0)+t*(o.speed??1)*7;
  ctx.save();ctx.translate(x,y);ctx.scale(s*f,s);
  if(o.pose==='stand'||o.pose==='wave'||o.pose==='gun'||o.pose==='work'){
    const hip=[0,-95],sh=[o.pose==='work'?26:0,o.pose==='work'?-150:-165];
    limb([hip,[-8,-48],[-12,0]],17,col);limb([hip,[8,-48],[14,0]],17,col);
    limb([hip,sh],30,col);
    if(o.pose==='wave'){const a=Math.sin(t*9)*.5;limb([sh,[-30,-205],[-40+a*30,-250]],12,col);limb([sh,[30,-205],[40-a*30,-250]],12,col)}
    else if(o.pose==='gun'){limb([sh,[40,-150],[80,-152]],12,col);limb([sh,[30,-140],[70,-148]],12,col);ctx.fillStyle=col;ctx.fillRect(40,-160,95,10)}
    else if(o.pose==='work'){const a=Math.sin(t*3+ (o.phase||0))*.5;limb([sh,[46,-110+a*10],[60,-70+a*20]],12,col);limb([sh,[36,-110],[50,-75]],12,col);ctx.strokeStyle=col;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(60,-150+a*20);ctx.lineTo(62,-10+a*20);ctx.stroke()}
    else{limb([sh,[-14,-120],[-16,-85]],12,col);limb([sh,[14,-120],[16,-85]],12,col)}
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(sh[0]+(o.pose==='work'?10:0),sh[1]-28,19,0,TAU);ctx.fill();
    if(o.mask){ctx.fillStyle=o.mask;ctx.fillRect(sh[0]-14,sh[1]-34,28,8)}
  } else { // run
    const l=Math.sin(ph);
    const hip=[0,-95],sh=[18,-165];
    limb([hip,[l*34+10,-52],[l*60-10*Math.abs(l),-4-Math.max(0,-l)*20]],16,col);
    limb([hip,[-l*34+10,-52],[-l*60,-4-Math.max(0,l)*20]],16,col);
    limb([hip,sh],29,col);
    limb([sh,[sh[0]-l*36,-130],[sh[0]-l*50+16,-104]],12,col);
    limb([sh,[sh[0]+l*36,-130],[sh[0]+l*50+20,-110]],12,col);
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(sh[0]+8,sh[1]-26,19,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function tinyFigure(x,y,s,col,ph){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+s*.25,y-s*1.05,s*.2,0,TAU);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=s*.22;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y-s*.45);ctx.lineTo(x+s*.15,y-s*.85);ctx.moveTo(x,y-s*.45);ctx.lineTo(x+Math.sin(ph)*s*.2,y);ctx.moveTo(x,y-s*.45);ctx.lineTo(x-Math.sin(ph)*s*.2,y);ctx.moveTo(x+s*.15,y-s*.8);ctx.lineTo(x+s*.5,y-s*.75+Math.sin(ph)*s*.05);ctx.stroke()}
function car(x,y,s,col,lights){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=col;
  rrect(-110,-60,220,48,14);ctx.fill();ctx.beginPath();ctx.moveTo(-70,-58);ctx.lineTo(-45,-100);ctx.lineTo(50,-100);ctx.lineTo(78,-58);ctx.fill();
  ctx.fillStyle='#050505';ctx.beginPath();ctx.arc(-62,-12,22,0,TAU);ctx.arc(62,-12,22,0,TAU);ctx.fill();
  if(lights){ctx.fillStyle=lights;ctx.shadowColor=lights;ctx.shadowBlur=30;ctx.fillRect(-112,-52,16,12);ctx.fillRect(96,-52,16,12);ctx.shadowBlur=0}
  ctx.restore()}
function deer(x,y,s,t,col){ctx.save();ctx.translate(x,y);ctx.scale(s,s);const l=Math.sin(t*4);
  limb([[-50,-90],[-55+l*12,-45],[-52+l*16,0]],9,col);limb([[-40,-90],[-38-l*12,-45],[-40-l*16,0]],9,col);
  limb([[40,-92],[44-l*12,-45],[46-l*14,0]],9,col);limb([[50,-92],[52+l*12,-45],[54+l*14,0]],9,col);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-105,62,28,0,0,TAU);ctx.fill();
  limb([[50,-115],[72,-160]],18,col);ctx.beginPath();ctx.ellipse(82,-166,22,12,.3,0,TAU);ctx.fill();
  limb([[68,-178],[60,-215],[48,-235]],4,col);limb([[60,-212],[76,-232]],4,col);limb([[76,-176],[86,-210],[100,-226]],4,col);limb([[85,-205],[70,-222]],4,col);
  ctx.restore()}
function crow(x,y,s,t){const f=Math.sin(t*10)*.8;ctx.strokeStyle='#050505';ctx.lineWidth=4*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-22*s,y-f*14*s);ctx.quadraticCurveTo(x-8*s,y-4*s,x,y);ctx.quadraticCurveTo(x+8*s,y-4*s,x+22*s,y-f*14*s);ctx.stroke()}
function fire(x,y,s,t,a=1){glow(x,y-30*s,340*s,'rgba(255,120,30,.55)',a);
  for(let i=0;i<7;i++){const k=i/6,h=(70+noise1(t*6+i*3)*25)*s*(1-k*.5),w=(28-k*12)*s;const xx=x+(i-3)*9*s+noise1(t*5+i)*6*s;
    ctx.fillStyle=i%2?'#ffb43c':'#ff5a1e';ctx.beginPath();ctx.moveTo(xx-w,y);ctx.quadraticCurveTo(xx-w*.6,y-h*.6,xx+noise1(t*7+i)*8*s,y-h);ctx.quadraticCurveTo(xx+w*.6,y-h*.6,xx+w,y);ctx.fill()}}
function smoke(x,y,t,col,n=9,scale=1){for(let i=0;i<n;i++){const k=((t*.08+i/n)%1);const r=(30+k*160)*scale;ctx.fillStyle=col;ctx.globalAlpha=(1-k)*.5;ctx.beginPath();ctx.arc(x+noise1(i*3+t*.3)*60*k+k*120*scale,y-k*700*scale,r,0,TAU);ctx.fill()}ctx.globalAlpha=1}
function rain(t,n,col,len=40,ang=.15){ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();const R=mulberry(5);for(let i=0;i<n;i++){const x=R()*W*1.2,sp=1400+R()*600,y=((R()*H+t*sp)%(H+200))-100;ctx.moveTo(x-y*ang*.1,y);ctx.lineTo(x-y*ang*.1-len*ang,y+len)}ctx.stroke()}
function snow(t,n){const R=mulberry(9);ctx.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<n;i++){const sp=80+R()*120,x=(R()*W+noise1(t*.5+i)*60+W)%W,y=((R()*H+t*sp)%H),r=2+R()*5;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}}
function tombstone(x,y,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-40*s,y);ctx.lineTo(x-40*s,y-80*s);ctx.arc(x,y-80*s,40*s,Math.PI,0);ctx.lineTo(x+40*s,y);ctx.fill()}
function cross(x,y,s,col){ctx.fillStyle=col;ctx.fillRect(x-6*s,y-110*s,12*s,110*s);ctx.fillRect(x-32*s,y-85*s,64*s,11*s)}

// text
function txt(str,x,y,size,col,o={}){ctx.save();ctx.font=`${o.font||'Russo'} ${size}px`;ctx.font=`${size}px ${o.font||'Russo'}`;ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'alphabetic';
  if(o.spacing)ctx.letterSpacing=o.spacing+'px';
  if(o.shadow){ctx.shadowColor=o.shadow;ctx.shadowBlur=o.blur||24}
  if(o.stroke){ctx.lineJoin='round';ctx.strokeStyle=o.stroke;ctx.lineWidth=o.sw||10;ctx.strokeText(str,x,y)}
  ctx.fillStyle=col;ctx.fillText(str,x,y);ctx.restore()}

// ---------------- SHOTS ----------------
// each: (lt seconds in shot, p progress 0..1, T global time, dur)
const S = {};

S.skyline=(lt,p,T)=>{
  fillAll(vgrad(0,H,[[0,'#07040a'],[.45,'#2a0710'],[.7,'#5c0f12'],[1,'#120306']]));
  moon(760,560,130,'#ffd9c2','rgba(255,60,40,.9)');
  ctx.fillStyle='#ff2a2a';ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(760,560,130,0,TAU);ctx.fill();ctx.globalAlpha=1;
  clouds(3,T,380,800,'rgba(20,5,10,.75)',8,14);
  skyline(11,1450,300,780,'#16060a','#ffcf7a',(i,c,r)=>hash(i*37+c*7+r*13)>.62?.85:0);
  skyline(12,1560,180,480,'#080305','#ff9a4a',(i,c,r)=>hash(i*17+c*3+r*11)>.75?.7:0);
  fillAll(vgrad(1500,H,[[0,'rgba(0,0,0,0)'],[1,'#000']]));
  // series title
  const a=smooth(.3,1.4,lt);
  ctx.save();ctx.globalAlpha=a;txt('ЧТО ЕСЛИ...',W/2,780,150,'#fff',{stroke:'#000',sw:16,shadow:'rgba(255,0,0,.8)',blur:40});ctx.restore();
  const b=smooth(1.6,2.4,lt);
  ctx.save();ctx.globalAlpha=b;txt('СЕРИЯ: КАТАСТРОФЫ',W/2,870,44,'#ff6060',{spacing:8});ctx.restore();
};
S.street=(lt,p,T)=>{
  fillAll(vgrad(0,H,[[0,'#04050c'],[.6,'#101528'],[1,'#030305']]));
  moon(200,420,60,'#e8e6ff','rgba(120,140,255,.4)');
  clouds(4,T,300,600,'rgba(5,6,15,.7)',6,10);
  // houses
  const R=mulberry(77);for(let i=0;i<6;i++){const x=-80+i*220,h=320+R()*120,y=1380;ctx.fillStyle='#07080f';ctx.fillRect(x,y-h,200,h);ctx.beginPath();ctx.moveTo(x-20,y-h);ctx.lineTo(x+100,y-h-110);ctx.lineTo(x+220,y-h);ctx.fill();
    if(R()>.35){const fl=noise1(T*3+i)>-.6?1:.2;ctx.fillStyle=rgba(255,200,110,.85*fl);ctx.fillRect(x+60,y-h+90,60,80)}}
  ctx.fillStyle='#050507';ctx.fillRect(0,1380,W,H);
  ctx.fillStyle='#0d0f18';ctx.beginPath();ctx.moveTo(0,1480);ctx.lineTo(W,1480);ctx.lineTo(W,1560);ctx.lineTo(0,1560);ctx.fill();
  // flickering street lamp
  const on=(noise1(T*9)>-.3&&hash(Math.floor(T*12))>.15)?1:.1;
  ctx.fillStyle='#0a0a0a';ctx.fillRect(760,880,14,520);ctx.fillRect(700,880,80,12);
  ctx.save();ctx.globalAlpha=on;ctx.fillStyle=rgrad(705,900,0,520,[[0,'rgba(255,230,160,.55)'],[1,'rgba(0,0,0,0)']]);ctx.beginPath();ctx.moveTo(690,895);ctx.lineTo(440,1520);ctx.lineTo(980,1520);ctx.lineTo(720,895);ctx.fill();glow(705,900,90,'rgba(255,240,190,1)');ctx.restore();
  // distant figure under lamp, standing then lurching
  zombie(640+lt*14,1500,1.0,lt*.6,{col:'#020203',jerky:true,speed:.4,eye:on>.5?null:'#ff2020'});
};
S.graveRise=(lt,p,T)=>{
  fillAll(vgrad(0,H,[[0,'#020604'],[.55,'#0c1f14'],[1,'#020302']]));
  moon(540,520,150,'#d8ffe0','rgba(80,255,140,.35)');
  clouds(6,T,400,700,'rgba(0,8,4,.8)',7,18);
  ctx.fillStyle='#030805';ctx.beginPath();ctx.moveTo(0,1180);ctx.quadraticCurveTo(540,1080,W,1200);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  const R=mulberry(21);for(let i=0;i<9;i++){const x=R()*W,y=1200+R()*120;R()>.5?tombstone(x,y,.7+R()*.4,'#08140c'):cross(x,y,.7+R()*.3,'#08140c')}
  fog(T,1200,'rgba(120,200,150,.10)');
  // ground mound
  const cx=540,gy=1560;
  ctx.fillStyle='#040805';ctx.fillRect(0,gy-10,W,H);
  // rising: hand then body
  const rise=smooth(.4,2.6,lt);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,gy);ctx.clip();
  const sh=lerp(260,0,rise);
  zombie(cx,gy+sh,2.1,lt*.4,{col:'#010201',armsUp:2.5,speed:.3,eye:rise>.7?'#7dff3a':null,tilt:.15});
  ctx.restore();
  // dirt chunks
  const D=mulberry(5);for(let i=0;i<22;i++){const a=D()*Math.PI,v=300+D()*500,tt=clamp(lt-.4,0,2);const x=cx+Math.cos(a)*v*tt*.6,y=gy-Math.sin(a)*v*tt+900*tt*tt;if(y<gy+20){ctx.fillStyle='#0b120c';ctx.fillRect(x,y,10+D()*14,8+D()*10)}}
  ctx.fillStyle='#030503';ctx.beginPath();ctx.ellipse(cx,gy,260,40,0,0,TAU);ctx.fill();
};
function fog(T,y,col){for(let i=0;i<5;i++){const x=((T*25*(i%2?1:-1)+i*400)%(W+800)+W+800)%(W+800)-400;ctx.fillStyle=rgrad(x,y+i*30,0,500,[[0,col],[1,'rgba(0,0,0,0)']]);ctx.fillRect(x-500,y-500+i*30,1000,1000)}}

// ---- DAY ----
S.news=(lt,p,T)=>{
  fillAll('#04060a');
  const fl=.75+.25*noise1(T*14);
  glow(540,820,900,rgba(60,120,255,.35*fl));
  // TV
  ctx.fillStyle='#0b0b0d';rrect(110,500,860,620,30);ctx.fill();
  ctx.save();rrect(140,530,800,560,10);ctx.clip();
  ctx.fillStyle='#0f2a55';ctx.fillRect(140,530,800,560);
  ctx.fillStyle=vgrad(530,1090,[[0,'#1d4f9a'],[1,'#071a3a']]);ctx.fillRect(140,530,800,560);
  // map with red spreading dots
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.ellipse(700,760,170,120,.3,0,TAU);ctx.fill();
  const R=mulberry(3);for(let i=0;i<40;i++){const a=R()*TAU,d=R()*150;if(R()<lt/5){ctx.fillStyle='rgba(255,40,40,.9)';ctx.beginPath();ctx.arc(700+Math.cos(a)*d,760+Math.sin(a)*d*.7,5+R()*6,0,TAU);ctx.fill()}}
  // anchor
  ctx.fillStyle='#050b18';ctx.beginPath();ctx.arc(360,760,70,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(360,960,150,140,0,Math.PI,0);ctx.fill();ctx.fillRect(210,955,300,140);
  // banner
  ctx.fillStyle='#d10f16';ctx.fillRect(140,930,800,70);
  txt('ЭКСТРЕННЫЕ НОВОСТИ',540,982,46,'#fff');
  ctx.fillStyle='#fff';ctx.fillRect(140,1000,800,50);
  ctx.save();ctx.beginPath();ctx.rect(140,1000,800,50);ctx.clip();
  const tick='ВСПЫШКА НЕИЗВЕСТНОЙ БОЛЕЗНИ  •  НАПАДЕНИЯ НА ЛЮДЕЙ  •  НЕ ВЫХОДИТЕ ИЗ ДОМА  •  ';
  txt(tick+tick,940-lt*220,1037,32,'#111',{align:'left'});ctx.restore();

  TL=tl;GROUPS=[];TL.duration=Math.max(120,TL.duration);TL.segments[TL.segments.length-1].end=TL.duration;
  TL.segments.forEach((seg,si)=>{const lines=TL.lines.filter(l=>l.seg===si);
    PLAN[seg.scene].forEach(([shot,...idx],gi)=>{
      const start=gi===0?seg.start:lines[idx[0]].start-0.15;
      GROUPS.push({scene:seg.scene,si,shot,start,lineStarts:idx.map(i=>lines[i].start)});
    });
  });
  GROUPS.forEach((g,i)=>g.end=i+1<GROUPS.length?GROUPS[i+1].start:TL.duration);
  // grain tiles
  GRAIN=[0,1,2,3].map(k=>{const c=document.createElement('canvas');c.width=270;c.height=480;const g=c.getContext('2d');const id=g.createImageData(270,480);const R=mulberry(k+1);for(let i=0;i<id.data.length;i+=4){const v=R()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0);return c});
}
let GRAIN=[];

function subtitle(t){
  const l=TL.lines.find(l=>t>=l.start-0.05&&t<=l.end+0.25);if(!l||l.is_card||l.seg===TL.segments.length-1)return;
  const words=l.text.toUpperCase().split(' ');
  const prog=clamp((t-l.start)/(l.end-l.start));
  const total=l.text.length;let acc=0;const wPos=words.map(w=>{const s=acc/total;acc+=w.length+1;return s});
  ctx.save();ctx.font='60px Russo';
  const lines=[[]];let lw=0;const sp=ctx.measureText(' ').width+16;
  words.forEach((w,i)=>{const ww=ctx.measureText(w).width;if(lw+ww>900&&lines[lines.length-1].length){lines.push([]);lw=0}lines[lines.length-1].push([w,i,ww]);lw+=ww+sp});
  const LH=80,y0=1440-(lines.length-1)*LH/2;
  const pop=easeOut((t-l.start+.05)/.18);
  lines.forEach((ln,j)=>{const tw=ln.reduce((a,b)=>a+b[2],0)+sp*(ln.length-1);let x=540-tw/2;
    ln.forEach(([w,i,ww])=>{const active=prog>=wPos[i];const cur=active&&(i===words.length-1||prog<wPos[i+1]);
      ctx.save();ctx.translate(x+ww/2,y0+j*LH);const s=(cur?1.05:1)*lerp(.85,1,pop);ctx.scale(s,s);ctx.globalAlpha=pop;
      txt(w,0,0,60,cur?'#ffd23a':(active?'#ffffff':'rgba(255,255,255,.55)'),{stroke:'#000',sw:12});ctx.restore();x+=ww+sp});
  });
  ctx.restore();
}

function hud(t,g){
  if(g.scene==='intro'||g.scene==='outro')return;
  // top chronology bar
  const cur=STEPS.indexOf(g.scene);
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.45)';rrect(70,150,940,150,30);ctx.fill();
  txt('ЧТО ЕСЛИ... ЗОМБИ-АПОКАЛИПСИС',540,205,34,'#fff',{spacing:2});
  const x0=170,x1=910,y=255;ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
  const segs=TL.segments;const sg=segs[g.si];const fr=clamp((t-sg.start)/(sg.end-sg.start));
  ctx.strokeStyle='#ff2b2b';ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(lerp(x0,x1,(cur+fr)/3.0>1?1:(cur+fr*(cur<3?1:0))/3),y);ctx.stroke();
  STEPS.forEach((s,i)=>{const x=lerp(x0,x1,i/3);const on=i<=cur;ctx.fillStyle=on?'#ff2b2b':'#444';ctx.beginPath();ctx.arc(x,y,i===cur?16:11,0,TAU);ctx.fill();if(i===cur){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke()}
    txt(STEP_LBL[i],x,y+42,24,on?'#fff':'#888')});
  ctx.restore();
}

function card(t,g){
  const seg=TL.segments[g.si];if(!seg.card)return;
  const first=TL.lines.find(l=>l.seg===g.si);const hit=seg.start+.65;const out=first.end+.35;
  if(t<seg.start-.3||t>out+.4)return;
  const a=t<hit?smooth(seg.start-.3,hit,t):1-smooth(out,out+.4,t);
  const sc=t<hit?lerp(2.4,1,easeOut((t-seg.start+.3)/.95)):1+.02*(t-hit);
  ctx.save();ctx.fillStyle=rgba(0,0,0,.55*a);ctx.fillRect(0,0,W,H);
  ctx.translate(540,920);ctx.scale(sc,sc);ctx.globalAlpha=a;ctx.rotate(-.03);
  const [w1,w2]=seg.card.split(' ');
  txt(w1,0,-70,110,'#fff',{stroke:'#000',sw:14});
  txt(w2,0,90,190,'#ff2020',{font:'Wet',shadow:'#000',blur:20,stroke:'#200',sw:8});
  txt(COUNTER[seg.scene],0,190,46,'#ffd23a',{spacing:10});
  ctx.restore();
}

function introTitle(t){
  const l=TL.lines.filter(l=>l.seg===0)[3];const hit=l.end+.05;const end=TL.segments[1].start;
  if(t<hit-.25||t>end+.2)return;
  const a=t<hit?smooth(hit-.25,hit,t):1-smooth(end-.2,end+.2,t);const sc=t<hit?lerp(3,1,smooth(hit-.25,hit,t)):1+.03*(t-hit);
  ctx.save();ctx.translate(540,760);ctx.scale(sc,sc);ctx.globalAlpha=a;
  txt('ЗОМБИ-',0,-40,190,'#7dff3a',{font:'Wet',shadow:'#000',blur:30,stroke:'#041',sw:8});
  txt('АПОКАЛИПСИС',0,120,120,'#fff',{stroke:'#000',sw:14});ctx.restore();
}

function shakeAt(t){
  let s=0;const hits=[];TL.segments.forEach(sg=>{if(sg.card)hits.push(sg.start+.65)});
  hits.push(TL.lines.filter(l=>l.seg===0)[3].end+.05);hits.push(TL.segments[TL.segments.length-1].start+.3);
  hits.forEach(h=>{const d=t-h;if(d>=0&&d<.6)s=Math.max(s,(1-d/.6)*26)});return s;
}

window.renderFrame=function(t){
  const gi=GROUPS.findIndex(g=>t>=g.start&&t<g.end);const g=GROUPS[gi<0?GROUPS.length-1:gi];
  const lt=t-g.start,dur=g.end-g.start,p=clamp(lt/dur);
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const sh=shakeAt(t);const z=1.04+.06*p;
  ctx.translate(W/2+noise1(t*40)*sh,H/2+noise1(t*40+9)*sh);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
  S[g.shot](lt,p,t,dur,g);
  ctx.restore();
  // vignette + grain
  ctx.fillStyle=rgrad(W/2,H/2,H*.28,H*.72,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.7)']]);ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.07;ctx.globalCompositeOperation='overlay';ctx.drawImage(GRAIN[Math.floor(t*24)%4],0,0,W,H);ctx.restore();
  // cut flash
  if(lt<.18&&gi>0){ctx.fillStyle=rgba(255,255,255,.35*(1-lt/.18));ctx.fillRect(0,0,W,H);
    const R=mulberry(Math.floor(t*60));for(let i=0;i<5;i++){const y=R()*H;ctx.drawImage(cv,0,y,W,40,(R()-.5)*80,y,W,40)}}
  if(t<0.6){ctx.fillStyle=rgba(0,0,0,1-t/.6);ctx.fillRect(0,0,W,H)}
  if(t>TL.duration-1.2){ctx.fillStyle=rgba(0,0,0,clamp((t-(TL.duration-1.2))/1.2));ctx.fillRect(0,0,W,H)}
  hud(t,g);introTitle(t);card(t,g);subtitle(t);
};
window.setupTL=setup;
</script></body></html>
